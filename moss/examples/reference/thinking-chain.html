<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moss thinking-chain reference</title>
  <link rel="stylesheet" href="../../system/tokens.css">
  <style>
    *{box-sizing:border-box} body{margin:0;background:var(--moss-color-surface-canvas);color:var(--moss-color-text-primary);font-family:var(--moss-font-sans);font-size:var(--moss-font-size-body);line-height:var(--moss-line-height-body)}
    main{width:min(900px,calc(100% - 48px));margin:0 auto;padding:56px 0 80px;display:grid;gap:40px}.message{min-width:0}.head{height:24px;display:flex;align-items:center;gap:8px;margin-bottom:6px}.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--moss-color-text-primary);color:var(--moss-color-surface-primary);font-size:10px;font-weight:600}.name{font-weight:600}.time{font-size:12px;line-height:20px;color:var(--moss-color-text-muted)}
    .status{height:22px;margin-bottom:6px;color:var(--moss-color-text-muted);font-weight:500;background:linear-gradient(90deg,var(--moss-color-running-base) 0 40%,var(--moss-color-running-highlight) 50%,var(--moss-color-running-base) 60% 100%);background-size:180% 100%;background-clip:text;color:transparent;animation:shine 1.4s linear infinite}.chain{max-height:528px;overflow:auto;padding-right:8px}.group{position:relative}.row{min-height:30px;display:flex;align-items:flex-start;gap:8px}.slot{width:16px;height:30px;display:grid;place-items:center;flex:none;color:var(--moss-color-text-secondary);position:relative;z-index:1}.done{width:14px;height:14px;border-radius:50%;background:currentColor;position:relative}.done:after{content:"";position:absolute;left:3.5px;top:3px;width:6px;height:3px;border-left:1.8px solid var(--moss-color-surface-primary);border-bottom:1.8px solid var(--moss-color-surface-primary);transform:rotate(-45deg)}.spin{width:15px;height:15px;border-radius:50%;background:conic-gradient(transparent 0 72deg,currentColor 255deg 360deg);mask:radial-gradient(farthest-side,transparent calc(100% - 1.5px),#000 calc(100% - 1.5px));animation:spin 1s linear infinite}.thought{padding:4px 0;color:var(--moss-color-text-secondary);overflow-wrap:anywhere}.more{font-size:13px;color:var(--moss-color-text-disabled);margin-left:4px}.connector{position:absolute;left:7.5px;top:29.5px;bottom:-.5px;width:1.25px;background:var(--moss-color-border-default)}.tools{margin-left:7.5px;padding-left:15.5px}.tool{min-height:30px;display:flex;gap:7px;color:var(--moss-color-text-tertiary);font-size:13px;line-height:20px}.tool-icon{width:14px;height:30px;display:grid;place-items:center;flex:none}.tool-icon svg{width:13px;height:13px}.tool-copy{padding-top:5px;display:flex;gap:6px;min-width:0;flex:1}.duration{margin-left:auto;color:var(--moss-color-text-muted);font-size:11px;font-variant-numeric:tabular-nums}.answer{margin-top:8px;padding:16px 18px;border:1px solid var(--moss-color-border-subtle);border-radius:8px;background:var(--moss-color-surface-secondary);color:var(--moss-color-text-secondary)}.answer strong{color:var(--moss-color-text-primary)}.complete{height:34px;display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:4px 0;color:var(--moss-color-text-muted);font:500 14px/22px var(--moss-font-sans)}.chev{font-size:16px;opacity:.72}.user{display:flex;justify-content:flex-end}.bubble{max-width:82%;padding:12px 16px;border-radius:6px;background:var(--moss-color-bubble-user);color:var(--moss-color-text-secondary)}
    @keyframes shine{to{background-position:0 50%}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.status,.spin{animation:none}}@media(max-width:600px){main{width:calc(100% - 32px);padding-top:32px;gap:32px}.duration{display:none}}
  </style>
  <script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')||'light'</script>
</head>
<body><main>
  <section class="user"><div class="bubble">请分析这份数据，并给出可执行结论。</div></section>
  <section class="message">
    <div class="head"><div class="mark">M</div><span class="name">Moss</span><span class="time">刚刚</span></div>
    <div class="status">正在处理中...</div>
    <div class="chain">
      <div class="group"><span class="connector"></span><div class="row"><span class="slot"><span class="done"></span></span><span class="thought">先确认数据字段与统计口径，再检查异常值和缺失项。<span class="more">更多</span></span></div><div class="tools"><div class="tool"><span class="tool-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M2 1.5h10v13H2zM5 5h5M5 8h5" stroke="currentColor" stroke-width="1.4"/></svg></span><span class="tool-copy">阅读 “sales.csv”<span class="duration">1.2s</span></span></div><div class="tool"><span class="tool-icon"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4"/></svg></span><span class="tool-copy">检查缺失值与异常分布<span class="duration">842ms</span></span></div></div></div>
      <div class="group"><span class="connector"></span><div class="row"><span class="slot"><span class="done"></span></span><span class="thought">关键变化集中在华东区域，需要进一步拆分渠道贡献。</span></div><div class="tools"><div class="tool"><span class="tool-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M3 13V8h3v5M7 13V3h3v10M11 13V6h3v7" stroke="currentColor" stroke-width="1.4"/></svg></span><span class="tool-copy">执行 Python 分组统计<span class="duration">2.4s</span></span></div></div></div>
      <div class="group"><div class="row"><span class="slot"><span class="spin"></span></span><span class="thought">整理证据与建议，确保结论能直接执行。</span></div></div>
    </div>
    <div class="answer"><strong>结论</strong>：华东直营渠道是本期增长主因；建议优先复用其转化路径，并单独排查华南渠道的流失节点。</div>
  </section>
  <section class="message"><div class="head"><div class="mark">M</div><span class="name">Moss</span><span class="time">2分钟前</span></div><button class="complete">已完成，耗时8s <span class="chev">⌄</span></button></section>
</main></body></html>
