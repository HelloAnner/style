<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>悟帆 AI 双主题对话工作区参考</title>
    <link rel="stylesheet" href="./wufan-chat.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .demo-icon {
        display: inline-flex;
        line-height: 0;
      }
    </style>
  </head>
  <body>
    <main
      id="chat-page"
      class="wufan-chat-page"
      data-theme="light"
      data-cvo-id="cvo-chat-page-reference"
    >
      <div class="wufan-background" aria-hidden="true"></div>
      <div class="wufan-app-shell">
        <button
          id="sidebar-scrim"
          class="wufan-sidebar-scrim"
          type="button"
          aria-label="关闭任务列表"
        ></button>

        <aside
          id="sidebar"
          class="wufan-sidebar"
          data-cvo-id="cvo-sidebar-inner"
          aria-label="悟帆任务导航"
        >
          <div class="wufan-sidebar__header">
            <div class="wufan-logo" aria-label="悟帆AI">
              <svg viewBox="0 0 70 70" aria-hidden="true">
                <path
                  d="M 40 6 A 29 29 0 1 0 40 64 A 20.5 25.2 0 1 1 40 6 Z"
                ></path>
                <circle cx="37" cy="22" r="4.2"></circle>
                <circle cx="51" cy="19" r="4.2"></circle>
              </svg>
              <span>悟帆AI</span>
            </div>
            <button
              id="close-sidebar"
              class="wufan-icon-button"
              type="button"
              aria-label="收起侧栏"
            >
              <span class="demo-icon" data-icon="chevrons-left"></span>
            </button>
          </div>

          <nav class="wufan-primary-nav" aria-label="主要功能">
            <button class="wufan-nav-item is-active" type="button">
              <span class="demo-icon" data-icon="plus"></span>
              <span>新任务</span>
            </button>
            <button class="wufan-nav-item" type="button">
              <span class="demo-icon" data-icon="automation"></span>
              <span>自动化</span>
            </button>
            <button class="wufan-nav-item" type="button">
              <span class="demo-icon" data-icon="bot"></span>
              <span>AI 员工</span>
            </button>
            <button class="wufan-nav-item" type="button">
              <span class="demo-icon" data-icon="sparkles"></span>
              <span>价值中心</span>
            </button>
          </nav>

          <div class="wufan-sidebar__divider"></div>
          <div class="wufan-task-heading">
            <span>任务</span>
            <div>
              <button
                class="wufan-icon-button is-small"
                type="button"
                aria-label="搜索任务"
              >
                <span class="demo-icon" data-icon="search" data-size="14"></span>
              </button>
              <button
                class="wufan-icon-button is-small"
                type="button"
                aria-label="任务菜单"
              >
                <span class="demo-icon" data-icon="more" data-size="14"></span>
              </button>
            </div>
          </div>

          <div class="wufan-session-list">
            <section class="wufan-session-group">
              <h2>今天</h2>
              <button class="wufan-session is-active" type="button">
                <span>查询空间信息</span>
                <span class="demo-icon" data-icon="more" data-size="14"></span>
              </button>
              <button class="wufan-session" type="button">
                <span>整理本周项目进展</span>
              </button>
            </section>
            <section class="wufan-session-group">
              <h2>过去 7 天</h2>
              <button class="wufan-session" type="button">
                <span>设计评审要点</span>
              </button>
            </section>
          </div>

          <div class="wufan-sidebar__footer">
            <button class="wufan-nav-item" type="button">
              <span class="demo-icon" data-icon="globe"></span>
              <span>探索空间</span>
            </button>
            <button class="wufan-user-row" type="button">
              <span class="wufan-user-avatar">午</span>
              <span class="wufan-user-row__label">
                <strong>午饭示例</strong>
                <small>个人空间</small>
              </span>
              <span class="demo-icon" data-icon="more" data-size="15"></span>
            </button>
          </div>
        </aside>

        <section class="wufan-chat-panel" aria-label="查询空间信息 对话">
          <header class="wufan-chat-header">
            <div class="wufan-chat-header__title">
              <button
                id="open-sidebar"
                class="wufan-icon-button wufan-mobile-menu"
                type="button"
                aria-label="打开任务列表"
              >
                <span class="demo-icon" data-icon="menu"></span>
              </button>
              <strong>小悟</strong>
              <span class="wufan-chat-header__slash">/</span>
              <span class="demo-icon" data-icon="message" data-size="14"></span>
              <span class="wufan-chat-header__session">查询空间信息</span>
              <button
                class="wufan-icon-button is-small"
                type="button"
                aria-label="收藏任务"
              >
                <span class="demo-icon" data-icon="star" data-size="14"></span>
              </button>
            </div>
            <div class="wufan-chat-header__actions">
              <button
                id="theme-toggle"
                class="wufan-icon-button"
                type="button"
                aria-label="切换暗色主题"
              >
                <span id="theme-icon" class="demo-icon" data-icon="moon"></span>
              </button>
              <button class="wufan-icon-button" type="button" aria-label="会话历史">
                <span class="demo-icon" data-icon="history"></span>
              </button>
              <button class="wufan-icon-button" type="button" aria-label="归档">
                <span class="demo-icon" data-icon="archive"></span>
              </button>
              <button class="wufan-icon-button" type="button" aria-label="更多操作">
                <span class="demo-icon" data-icon="more"></span>
              </button>
            </div>
          </header>

          <div id="message-scroll" class="wufan-message-scroll">
            <div id="message-list" class="wufan-message-list" aria-live="polite">
              <article class="wufan-message is-user">
                <span class="wufan-message-user-avatar" aria-hidden="true">
                  <span class="demo-icon" data-icon="user" data-size="15"></span>
                </span>
                <div class="wufan-message__content">
                  <div class="wufan-message__meta">
                    <strong>你</strong>
                    <time>10:24</time>
                  </div>
                  <div class="wufan-message__bubble">
                    <p>帮我查询一下当前空间的基本信息，并整理成容易阅读的摘要。</p>
                  </div>
                  <div class="wufan-message__tools" aria-label="消息操作">
                    <button type="button" aria-label="复制">
                      <span class="demo-icon" data-icon="copy" data-size="14"></span>
                    </button>
                  </div>
                </div>
              </article>

              <article class="wufan-message is-agent">
                <span class="wufan-agent-avatar" aria-hidden="true"></span>
                <div class="wufan-message__content">
                  <div class="wufan-message__meta">
                    <strong>小悟</strong>
                    <time>10:24</time>
                  </div>
                  <div class="wufan-message__bubble">
                    <p>已经找到当前空间的信息，摘要如下：</p>
                    <h3>空间概览</h3>
                    <ul>
                      <li><strong>空间名称：</strong>产品设计协作空间</li>
                      <li><strong>空间类型：</strong>团队工作空间</li>
                      <li><strong>当前状态：</strong>正常运行</li>
                    </ul>
                    <h3>使用建议</h3>
                    <p>
                      可以继续让我整理成员分工、最近任务或自动化执行情况。我会保持同一会话上下文。
                    </p>
                  </div>
                  <div class="wufan-message__tools" aria-label="消息操作">
                    <button type="button" aria-label="复制">
                      <span class="demo-icon" data-icon="copy" data-size="14"></span>
                    </button>
                    <button type="button" aria-label="有帮助">
                      <span class="demo-icon" data-icon="thumbs-up" data-size="14"></span>
                    </button>
                    <button type="button" aria-label="没有帮助">
                      <span
                        class="demo-icon"
                        data-icon="thumbs-down"
                        data-size="14"
                      ></span>
                    </button>
                  </div>
                </div>
              </article>
            </div>
          </div>

          <div class="wufan-composer-wrap">
            <div class="wufan-composer" data-cvo-id="cvo-chat-composer">
              <textarea
                id="composer-input"
                rows="1"
                placeholder="给小悟发送消息..."
                aria-label="消息内容"
              ></textarea>
              <div class="wufan-composer__toolbar">
                <div class="wufan-composer__tools">
                  <button type="button" aria-label="添加附件">
                    <span class="demo-icon" data-icon="paperclip"></span>
                  </button>
                  <button class="wufan-tool-pill" type="button">
                    <span class="demo-icon" data-icon="lightning" data-size="14"></span>
                    <span>深度思考</span>
                  </button>
                  <button class="wufan-tool-pill" type="button">
                    <span>Qwen 3.7 Plus</span>
                    <span
                      class="demo-icon"
                      data-icon="chevron-down"
                      data-size="13"
                    ></span>
                  </button>
                </div>
                <button
                  id="send-button"
                  class="wufan-send-button"
                  type="button"
                  aria-label="发送消息"
                  disabled
                >
                  <span class="demo-icon" data-icon="send" data-size="17"></span>
                </button>
              </div>
            </div>
            <p class="wufan-composer-note">
              AI 生成内容可能存在错误，请核对重要信息。
            </p>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const paths = {
          archive:
            '<rect width="18" height="4" x="3" y="3" rx="1"/><path d="M5 7v13h14V7M10 11h4"/>',
          automation:
            '<path d="M4 7h16M7 4v6M4 17h16M17 14v6"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/>',
          bot:
            '<rect width="16" height="12" x="4" y="8" rx="3"/><path d="M9 12h.01M15 12h.01M9 16h6M12 8V4M9 4h6"/>',
          "chevron-down": '<path d="m6 9 6 6 6-6"/>',
          "chevrons-left": '<path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/>',
          copy:
            '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
          globe:
            '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
          history:
            '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
          lightning: '<path d="m13 2-9 12h8l-1 8 9-12h-8l1-8Z"/>',
          menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
          message:
            '<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/><path d="M8 9h8M8 13h5"/>',
          moon:
            '<path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>',
          more:
            '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
          paperclip:
            '<path d="m21.4 11.6-8.5 8.5a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 1 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          search:
            '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
          send:
            '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
          sparkles:
            '<path d="m12 3-1.2 3.4a4 4 0 0 1-2.4 2.4L5 10l3.4 1.2a4 4 0 0 1 2.4 2.4L12 17l1.2-3.4a4 4 0 0 1 2.4-2.4L19 10l-3.4-1.2a4 4 0 0 1-2.4-2.4Z"/><path d="m19 17-.5 1.5L17 19l1.5.5L19 21l.5-1.5L21 19l-1.5-.5Z"/>',
          star:
            '<path d="m12 2 3 6.1 6.7 1-4.9 4.7 1.2 6.7-6-3.1-6 3.1 1.2-6.7-4.9-4.7 6.7-1Z"/>',
          sun:
            '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
          "thumbs-down":
            '<path d="M17 14V3H5.5L3 10v4h6l-1 5a2 2 0 0 0 2 2l5-7h2a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3"/>',
          "thumbs-up":
            '<path d="M7 10v11H3V10h4Zm0 9h10a3 3 0 0 0 3-3v-5a3 3 0 0 0-3-3h-2l1-5a2 2 0 0 0-2-2L9 8H7"/>',
          user:
            '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        };

        const renderIcon = (node) => {
          const size = node.dataset.size || "16";
          const icon = node.dataset.icon;
          node.innerHTML =
            '<svg width="' +
            size +
            '" height="' +
            size +
            '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (paths[icon] || "") +
            "</svg>";
        };
        document.querySelectorAll("[data-icon]").forEach(renderIcon);

        const page = document.querySelector("#chat-page");
        const themeToggle = document.querySelector("#theme-toggle");
        const themeIcon = document.querySelector("#theme-icon");
        const params = new URLSearchParams(window.location.search);

        const setTheme = (theme) => {
          const next = theme === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = next;
          page.dataset.theme = next;
          themeIcon.dataset.icon = next === "light" ? "moon" : "sun";
          themeToggle.setAttribute(
            "aria-label",
            next === "light" ? "切换暗色主题" : "切换明色主题",
          );
          renderIcon(themeIcon);
        };
        setTheme(params.get("theme"));

        themeToggle.addEventListener("click", () => {
          setTheme(page.dataset.theme === "light" ? "dark" : "light");
        });

        const sidebar = document.querySelector("#sidebar");
        const scrim = document.querySelector("#sidebar-scrim");
        const setSidebar = (open) => {
          sidebar.classList.toggle("is-open", open);
          scrim.classList.toggle("is-open", open);
        };
        document
          .querySelector("#open-sidebar")
          .addEventListener("click", () => setSidebar(true));
        document
          .querySelector("#close-sidebar")
          .addEventListener("click", () => setSidebar(false));
        scrim.addEventListener("click", () => setSidebar(false));

        const textarea = document.querySelector("#composer-input");
        const sendButton = document.querySelector("#send-button");
        const messageList = document.querySelector("#message-list");
        const messageScroll = document.querySelector("#message-scroll");

        const updateComposer = () => {
          textarea.style.height = "24px";
          textarea.style.height = Math.min(textarea.scrollHeight, 160) + "px";
          const active = textarea.value.trim().length > 0;
          sendButton.disabled = !active;
          sendButton.classList.toggle("is-active", active);
        };

        const send = () => {
          const value = textarea.value.trim();
          if (!value) return;
          const article = document.createElement("article");
          article.className = "wufan-message is-user";
          const time = new Intl.DateTimeFormat("zh-CN", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(new Date());
          article.innerHTML =
            '<span class="wufan-message-user-avatar" aria-hidden="true"><span class="demo-icon" data-icon="user" data-size="15"></span></span>' +
            '<div class="wufan-message__content"><div class="wufan-message__meta"><strong>你</strong><time>' +
            time +
            '</time></div><div class="wufan-message__bubble"><p></p></div><div class="wufan-message__tools"><button type="button" aria-label="复制"><span class="demo-icon" data-icon="copy" data-size="14"></span></button></div></div>';
          article.querySelector("p").textContent = value;
          article.querySelectorAll("[data-icon]").forEach(renderIcon);
          messageList.appendChild(article);
          textarea.value = "";
          updateComposer();
          messageScroll.scrollTo({
            top: messageScroll.scrollHeight,
            behavior: "smooth",
          });
        };

        textarea.addEventListener("input", updateComposer);
        textarea.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            send();
          }
        });
        sendButton.addEventListener("click", send);
        updateComposer();
      })();
    </script>
  </body>
</html>
