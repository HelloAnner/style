  <script>
    (function () {
      var ENV_ORIGIN = window.location.origin && window.location.origin !== 'null'
        ? window.location.origin
        : '';
      var PUBLIC_HOME_URL = ENV_ORIGIN || '/';
      var OFFICIAL_ATTRIBUTION_URL = buildEnvUrl('/r/Official');

      function buildEnvUrl(path) {
        if (!ENV_ORIGIN) return path;
        return ENV_ORIGIN + path;
      }

      function readStorage(storage, key) {
        try {
          return storage && storage.getItem(key);
        } catch (e) {
          return null;
        }
      }

      function hasTokenLikeValue(value) {
        if (!value || value === 'null' || value === 'undefined') return false;
        if (/^(eyJ|sk-|pk_|sess_|Bearer\s+)/.test(value)) return true;
        try {
          var parsed = JSON.parse(value);
          var text = JSON.stringify(parsed).toLowerCase();
          return !!(
            parsed &&
            (
              parsed.token ||
              parsed.access_token ||
              parsed.accessToken ||
              parsed.refresh_token ||
              parsed.session ||
              parsed.user ||
              parsed.state && (parsed.state.token || parsed.state.accessToken || parsed.state.user) ||
              text.indexOf('access_token') >= 0 ||
              text.indexOf('refresh_token') >= 0
            )
          );
        } catch (e) {
          return value.length > 24 && /token|session|auth|jwt/i.test(value);
        }
      }

      function isLoggedIn() {
        var keys = [
          'token',
          'access_token',
          'auth_token',
          'corevo_token',
          'corevo-auth',
          'auth-storage',
          'cvo-auth-storage',
          'sb-server-auth-token'
        ];
        for (var i = 0; i < keys.length; i++) {
          if (hasTokenLikeValue(readStorage(window.localStorage, keys[i])) || hasTokenLikeValue(readStorage(window.sessionStorage, keys[i]))) {
            return true;
          }
        }
        try {
          if (/(^|;\s*)(token|auth_token|access_token|session|jwt)=/.test(document.cookie)) return true;
        } catch (e) {}
        return false;
      }

      function getAuthClickTarget(mode, redirectPath) {
        var normalizedRedirect = normalizeInternalPath(redirectPath || '/app');
        if (isLoggedIn()) return buildEnvUrl(normalizedRedirect);
        var target = new URL(OFFICIAL_ATTRIBUTION_URL);
        target.searchParams.set('redirect', normalizedRedirect);
        if (mode === 'register') target.searchParams.set('mode', 'register');
        return target.toString();
      }

      function normalizeInternalPath(path) {
        if (!path || typeof path !== 'string') return '/app';
        if (path.charAt(0) !== '/' || path.indexOf('//') === 0) return '/app';
        return path;
      }

      function isPlainPrimaryClick(ev) {
        return ev.button === 0 && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && !ev.altKey;
      }

      document.querySelectorAll('[data-auth-link], [data-auth-signup]').forEach(function (el) {
        el.setAttribute('href', PUBLIC_HOME_URL);
      });
      document.addEventListener('click', function (ev) {
        var link = ev.target.closest && ev.target.closest('[data-auth-link], [data-auth-signup]');
        if (!link) return;
        if (!isPlainPrimaryClick(ev)) return;
        ev.preventDefault();
        var mode = link.hasAttribute('data-auth-signup') ? 'register' : 'login';
        window.location.assign(getAuthClickTarget(mode, normalizeInternalPath(link.getAttribute('data-auth-redirect'))));
      });
    })();

    (function () {
      var item = document.querySelector('[data-nav-dropdown]');
      if (!item) return;
      var trigger = item.querySelector('.site-nav-trigger');
      trigger.addEventListener('click', function () {
        item.classList.toggle('is-open');
      });
      document.addEventListener('click', function (ev) {
        if (!item.contains(ev.target)) item.classList.remove('is-open');
      });
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') item.classList.remove('is-open');
      });
    })();
  </script>

  <script>
    (function () {
      var grid = document.querySelector('[data-learn-grid]');
      if (!grid) return;
      var cards = Array.prototype.slice.call(grid.querySelectorAll('.learn-card'));
      var search = document.getElementById('learnSearch');
      var chips = document.querySelectorAll('[data-learn-filter]');
      var views = document.querySelectorAll('[data-learn-view]');
      var empty = document.querySelector('[data-learn-empty]');
      var catalog = grid.closest('.learn-catalog');
      var activeType = 'all';

      function apply() {
        var q = ((search && search.value) || '').trim().toLowerCase();
        var shown = 0;
        cards.forEach(function (c) {
          var typeOk = activeType === 'all' || c.getAttribute('data-type') === activeType;
          var text = (c.getAttribute('data-search') || '').toLowerCase();
          var searchOk = !q || text.indexOf(q) >= 0;
          var show = typeOk && searchOk;
          c.hidden = !show;
          if (show) shown++;
        });
        if (empty) empty.hidden = shown > 0;
      }

      if (search) search.addEventListener('input', apply);
      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          activeType = chip.getAttribute('data-learn-filter') || 'all';
          chips.forEach(function (c) { c.classList.toggle('is-active', c === chip); });
          apply();
        });
      });
      views.forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (catalog) catalog.classList.toggle('is-list', btn.getAttribute('data-learn-view') === 'list');
          views.forEach(function (b) { b.classList.toggle('is-active', b === btn); });
        });
      });
    })();
  </script>

  <script>
    // 卡片封面视频：视口外 / 列表视图（display:none）自动暂停省电
    (function () {
      var v = document.querySelector('.learn-card-cover-video');
      if (!v || !('IntersectionObserver' in window)) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting && !reduce) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
          else { v.pause(); }
        });
      }, { threshold: 0.01 }).observe(v);
    })();
  </script>
