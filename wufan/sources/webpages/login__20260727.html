    <script id="cvo-theme-preload">
      (function () {
        var preference = 'system';
        try {
          preference = window.localStorage.getItem('corevo-theme') || 'system';
        } catch (_) {
          // localStorage may be unavailable in private/restricted browsing contexts.
        }

        var systemIsDark = window.matchMedia
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : true;
        var theme = preference === 'light'
          ? 'light'
          : preference === 'dark'
            ? 'dark'
            : systemIsDark ? 'dark' : 'light';

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#0A0A0F' : '#FAF9F7';
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
